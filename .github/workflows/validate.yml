name: Validate theme
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find themes dev -name '*.php' -print0 | xargs -0 -n1 php -l
  assets-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check themes/wp-main-theme/assets/js/navigation.js
      - run: node --check scripts/preview.mjs
      - run: node --check scripts/smoke-preview.mjs
      - shell: pwsh
        run: ./scripts/package.ps1
